<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>図書館からのお知らせ</title>
  </head>
  <body>
    <h1>図書館からのお知らせ</h1>
    <p>図書館は9時から18時まで利用できます。</p>
  </body>
</html>

<!--
インデントの考え方
- html の直下にある head と body は、1段階(2スペース)下げます。
- head の中の meta と title は、さらに1段階下げます。
- body の中の h1 と p も、同じ深さにそろえます。
- 開始タグと終了タグ(<head> と </head> など)は、同じ位置にそろえます。
- <!DOCTYPE html> は要素ではないので、インデントしません。
-->
